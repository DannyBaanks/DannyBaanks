name: Profile hero

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: Normalize static bilingual heroes
        run: python scripts/update_hero.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/eva/common/hero-signal-es.png assets/eva/common/hero-signal-en.png
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: normalize profile heroes [skip ci]"
            git push
          fi
